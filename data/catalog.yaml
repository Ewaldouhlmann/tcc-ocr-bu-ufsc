    gpu: "nao"
    cer_literatura: "6-14%"
    wer_literatura: "12-25%"
    observacoes: "Requer LLAMA_CLOUD_API_KEY; envio de dados a terceiros"

  mistral:
    nome: "Mistral OCR"
    categoria: "vlm_api"
    arquivo: "src/ocr/vlm/mistral_ocr.py"
    custo: "pago"
    gpu: "nao"
    cer_literatura: "5-12%"
    wer_literatura: "10-20%"
    observacoes: "Requer MISTRAL_API_KEY; imagem enviada em base64"

  gemini:
    nome: "Gemini 2.0 Flash"
    categoria: "vlm_api"
